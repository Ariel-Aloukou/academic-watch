# Configuration de pytest.
#
# `pythonpath = src` permet d'écrire `import storage` dans les tests sans
# installer le projet et sans `sys.path` manipulé à la main dans chaque fichier.
# C'est une option de pytest depuis la 7.0, et elle évite d'avoir un `conftest.py`
# qui ne fait que ça.
#
# `testpaths = tests` : sans elle, pytest chercherait aussi dans `venv/`.
[pytest]
pythonpath = src
testpaths = tests
